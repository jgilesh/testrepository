// ── QDA — dark tab opener, one per tab ────────────────────────
function QDA({question,options,action,color}){
  const c = color||OR;
  return(
    <div style={{background:"linear-gradient(130deg,#1a1108,#2c1d0e)",borderRadius:"12px",padding:"18px 20px",marginBottom:"16px"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"7px"}}>❓ The Question</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.15rem",color:"#fff",lineHeight:"1.4",marginBottom:"13px"}}>{question}</div>

      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"13px"}}>
        <span style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",flexShrink:0}}>⚖️ Decision</span>
        <div style={{display:"flex",gap:"7px",alignItems:"center",flexWrap:"wrap"}}>
          {options.map((o,i)=>(
            <span key={o} style={{display:"inline-block",padding:"4px 13px",borderRadius:"999px",background:i===0?c:"rgba(255,255,255,0.08)",border:"1px solid "+(i===0?c:"rgba(255,255,255,0.16)"),color:i===0?"#fff":"#d4a87a",fontSize:"0.72rem",fontWeight:"700",letterSpacing:"0.04em"}}>{o}</span>
          ))}
        </div>
      </div>

      <div style={{borderTop:"1px solid rgba(255,255,255,0.09)",paddingTop:"12px"}}>
        <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"6px"}}>✅ The Action</div>
        <div style={{fontSize:"0.83rem",color:"#e8ddd0",lineHeight:"1.65"}}>{action}</div>
      </div>
    </div>
  );
}

  const fast = style && (style.id==="scalp" || style.id==="daytrade");

    ? (fast

      <div style={{background:"#fff4eb",border:"1px solid #fad0a8",borderRadius:"10px",padding:"11px 14px",marginBottom:"16px",display:"flex",gap:"10px",alignItems:"flex-start"}}>
        <span style={{fontSize:"0.9rem",flexShrink:0}}>💡</span>
        <div style={{fontSize:"0.77rem",color:"#5a4535",lineHeight:"1.55"}}>The Options Chain module explains what each of these terms means. This tab gives you <strong>Dominique's specific requirements</strong> for each one. {style?"The values below are set for "+style.label+".":"Choose a style on the previous tab and these values set themselves."}</div>
      </div>

      <SectionLabel label="Contract Criteria — All Must Pass" sub={style?"Set for "+style.label+". Tap each to see why it matters.":"Tap each to compare across all four styles."} color={accent}/>
      <ChainCriteria style={style} open={open} toggle={toggle}/>

      {style&&<RuleBox rule={"Final contract check for a "+style.label.toLowerCase()+": "+style.chain.delta+" Delta · "+style.chain.dte+" · OI "+style.chain.oi+" · "+style.chain.premium+". If one criterion fails, there is no trade, regardless of how good the chart looks."} color={style.color}/>}

      <DomQ>Does this contract give my thesis enough time to work?</DomQ>

      <Resources items={[
        {icon:"⛓️",label:"The Options Chain",url:LINK.chain},
        {icon:"🧮",label:"Return Calculator",url:LINK.calc},
        {icon:"📝",label:"Trade Planner — Steps Two & Three",url:LINK.planner23},
      ]}/>

      <NextBtn label="Next: Execute the Trade" onClick={onNext}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TAB 5 — EXECUTE THE TRADE
// ═══════════════════════════════════════════════════════════════
function TabExecute({style}){
  const candleTf = style ? style.candle : "confirmation";
  const accent = style?style.color:OR;

  return(
    <div className="fu">
      <QDA
        question="Is my plan complete?"
        options={["Enter","Wait"]}
        action="If everything below is defined in writing, place the order. If anything is still an assumption in your head, it isn't a plan yet."
        color={accent}
      />

      <SectionLabel label="Final Checks — In Order" color={accent}/>

      <div style={{display:"flex",flexDirection:"column",gap:"10px",marginBottom:"18px"}}>
        {[
          {n:"1",color:GR,icon:"🕐",
            title:"Is my entry level confirmed on the chart?",
            body:"Wait for the "+candleTf+" candle to fully close at your level. Intra-candle entries get faked out constantly. The close is the truth — everything before it is a rumor.",
            rule:"Wait for the candle close. The close is the truth. Everything before it is a rumor."},
          {n:"2",color:accent,icon:"📋",
            title:"Have I run every contract criterion?",
            body:style
              ? "Final check: "+style.chain.delta+" Delta · "+style.chain.dte+" · OI "+style.chain.oi+" · "+style.chain.premium+". If any one fails, do not enter — regardless of how good the chart looks."
              : "Strike, Delta, DTE, Theta, open interest, volume, and premium against account size. If any one fails, do not enter — regardless of how good the chart looks.",
            rule:"The criteria are not optional. Running them every time is the difference between a process and a gamble."},
          {n:"3",color:PU,icon:"⛔",
            title:"Do I know my exit before I enter?",
            body:style
              ? "Profit target: "+style.target.split(".")[0]+". Invalidation: "+style.invalid.split(".")[0]+". Both defined now — while you're calm — not while watching the position move."
              : "Your profit target and your invalidation level both get written down now — while you're calm — not while watching the position move.",
            rule:"Never enter a trade without knowing exactly where you exit at a win and where the thesis is invalid. Both are set before the order is placed."},
        ].map(item=>(
          <div key={item.n} style={{background:CA,border:"1px solid "+BD,borderRadius:"12px",padding:"16px 18px",borderLeft:"4px solid "+item.color}}>
            <div style={{display:"flex",gap:"14px",alignItems:"flex-start"}}>
              <div style={{width:"32px",height:"32px",borderRadius:"50%",background:item.color,color:"#fff",fontWeight:"700",fontSize:"0.9rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{item.n}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
                  <span style={{fontSize:"1.1rem"}}>{item.icon}</span>
                  <span style={{fontWeight:"700",fontSize:"0.9rem",color:DK}}>{item.title}</span>
                </div>
                <div style={{fontSize:"0.82rem",color:"#5a4535",lineHeight:"1.6",marginBottom:"10px"}}>{item.body}</div>
                <RuleBox rule={item.rule} color={item.color}/>
              </div>
            </div>
          </div>
        ))}
      </div>

      <SectionLabel label="Timing & Order Type" sub="Dominique's execution mechanics." color={accent}/>
      <div className="g2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"18px"}}>
        <InfoCard icon="⏰" title="Time of Day" color={OR}>Dominique likes the mid-morning window after the open settles — roughly 10:00 to 11:30 AM ET. She avoids the first 5 to 10 minutes because that opening volatility is a trap, and she's cautious in the lunchtime lull when volume thins out and moves get unreliable.</InfoCard>
        <InfoCard icon="📝" title="Limit vs. Market" color={GR}>A combination of both. Limit orders to enter at your price, especially on wider spreads. Market orders only when you need to get out now and speed beats precision.</InfoCard>
        <InfoCard icon="🕯️" title="Candle Confirmation" color={GD}>Swing: the 1-hour close, sometimes the 4-hour. Scalp and day trade: the 1-minute or 5-minute close. LEAP: the weekly. Whatever the style, wait for the close.</InfoCard>
        <InfoCard icon="💬" title={style?"The mindset — "+style.label:"The mindset"} color={accent}>{style?style.mindset:"\"I know why I'm in, how long I expect to be in, and exactly what tells me I'm wrong. If I can't say all three out loud, I don't have a trade yet.\""}</InfoCard>
      </div>

      <SectionLabel label="Final Review" sub="Say these out loud before the order goes in." color={accent}/>
      <div style={{background:CA,border:"1px solid "+BD,borderRadius:"14px",overflow:"hidden",marginBottom:"18px"}}>
        {[
          {q:"What is my entry level?",a:"A specific price, not a zone you'll figure out later."},
          {q:"What is my profit target?",a:style?style.target.split(".")[0]+".":"A specific number, defined before you enter."},
          {q:"What invalidates this trade?",a:style?style.invalid.split(".")[0]+".":"The specific condition that proves the thesis wrong."},
          {q:"How many contracts, and what is my max risk in dollars?",a:"A dollar figure you can say out loud, sized to your account."},
          {q:"Is any of this still in my head instead of on the planner?",a:"If yes, write it down first. The order can wait ninety seconds."},
        ].map((r,i,arr)=>(
          <div key={i} style={{padding:"12px 16px",borderBottom:i<arr.length-1?"1px solid "+BD:"none"}}>
            <div style={{fontWeight:"700",fontSize:"0.83rem",color:DK,marginBottom:"3px"}}>{r.q}</div>
            <div style={{fontSize:"0.77rem",color:"#5a4535",lineHeight:"1.55"}}>{r.a}</div>
          </div>
        ))}
      </div>

      <DomQ>If this trade moved against me immediately, would I still trust my plan?</DomQ>

      <div style={{background:"linear-gradient(130deg,#1a1108,#2c1d0e)",borderRadius:"14px",padding:"22px 24px",marginTop:"20px"}}>
        <div style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"8px"}}>🗺️ End of module</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.35rem",color:"#fff",marginBottom:"14px"}}>Your Trade Plan Is Complete</div>
        <div style={{fontSize:"0.8rem",color:"#d4a87a",marginBottom:"12px"}}>You now have:</div>
        {[
          "A market thesis",
          "A validated setup",
          "The appropriate trading style"+(style?" — "+style.label:""),
          "A contract that supports your thesis",
          "Defined risk",
          "Defined profit target",
          "A completed Trade Planner",
        ].map((t,i)=>(
          <div key={i} style={{display:"flex",gap:"10px",alignItems:"flex-start",padding:"6px 0"}}>
            <span style={{color:GR,fontSize:"0.85rem",flexShrink:0}}>✅</span>
            <span style={{fontSize:"0.85rem",color:"#e8ddd0",lineHeight:"1.5"}}>{t}</span>
          </div>
        ))}
        <div style={{marginTop:"14px",paddingTop:"14px",borderTop:"1px solid rgba(255,255,255,0.09)",fontFamily:"Georgia,serif",fontSize:"1rem",color:"#fff"}}>
          Now you're ready to place the trade.
        </div>
      </div>

      <Resources items={[
        {icon:"🧮",label:"Return Calculator",url:LINK.calc},
        {icon:"📝",label:"Trade Planner (completed)",url:LINK.planner23},
      ]}/>

      <PlannerBridge/>
      <ChecklistBridge/>

      <div style={{marginTop:"20px",textAlign:"center",fontSize:"0.65rem",color:"#b0a090",letterSpacing:"0.05em"}}>
        <span style={{fontFamily:"Georgia,serif",fontStyle:"italic"}}>demystified</span> · For educational purposes only
      </div>
    </div>
  );
}

// ── Selected-style chip ───────────────────────────────────────
function StyleChip({style,onClear}){
  if(!style) return null;
  return(
    <div style={{display:"flex",alignItems:"center",gap:"9px",background:style.color+"12",border:"1px solid "+style.color+"55",borderRadius:"999px",padding:"5px 7px 5px 14px",marginBottom:"12px",width:"fit-content"}}>
      <span style={{fontSize:"0.7rem",color:"#8a7560",fontWeight:"600"}}>Planning as</span>
      <span style={{fontSize:"0.76rem",fontWeight:"700",color:style.color}}>{style.label}</span>
      <button onClick={onClear} style={{background:"none",border:"none",cursor:"pointer",color:"#8a7560",fontSize:"0.8rem",lineHeight:"1",padding:"3px 6px"}}>✕</button>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────
const TABS=[
  {label:"Before",   icon:"☀️"},
  {label:"Validate", icon:"📈"},
  {label:"Style",    icon:"🎚️"},
  {label:"Contract", icon:"⛓️"},
  {label:"Execute",  icon:"🚀"},
];

function App(){
  const[styleId,setStyleId]=useState(null);
  const[tab,setTab]=useState(0);
  const style = styleId?STYLES[styleId]:null;

  function goTab(i){ setTab(i); window.scrollTo({top:0,behavior:"smooth"}); }
  function selectStyle(id){ setStyleId(p=>p===id?null:id); }

  return(
    <div>
      <div style={{background:DK,padding:"11px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1.2rem",color:"#fff"}}>demystified</span>
        <a href="https://options101-hub.vercel.app/"
          style={{display:"flex",alignItems:"center",gap:"6px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.14)",borderRadius:"999px",padding:"5px 14px",textDecoration:"none"}}
          onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.15)"}
          onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
          <span style={{color:"#d4a87a",fontSize:"0.8rem"}}>←</span>
          <span style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#d4a87a"}}>Options 101 Hub</span>
        </a>
        <div style={{width:"22px",height:"22px",background:OR,borderRadius:"5px"}}/>
      </div>

      <div style={{maxWidth:"860px",margin:"0 auto",padding:"22px 16px 60px"}}>
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a7560",marginBottom:"6px"}}>Module 5</div>
          <h1 style={{fontFamily:"Georgia,serif",fontSize:"clamp(1.7rem,4vw,2.3rem)",color:DK,letterSpacing:"-0.03em",lineHeight:"1.15",marginBottom:"4px"}}>Trade Planning</h1>
          <p style={{color:"#8a7560",fontSize:"0.85rem"}}>From market open to order placed.</p>
        </div>

        <StyleChip style={style} onClear={()=>setStyleId(null)}/>

        <div style={{display:"flex",gap:"3px",background:"#e4d8c8",borderRadius:"12px",padding:"3px",marginBottom:"10px"}}>
          {TABS.map((t,i)=>(
            <button key={i} onClick={()=>goTab(i)} style={{
              flex:1,padding:"9px 4px",border:"none",borderRadius:"9px",cursor:"pointer",
              fontWeight:"700",fontSize:"0.62rem",letterSpacing:"0.02em",transition:"all 0.18s",
              background:tab===i?"#fff":"transparent",
              color:tab===i?(style?style.color:OR):"#8a7560",
              boxShadow:tab===i?"0 1px 6px rgba(0,0,0,0.09)":"none",lineHeight:"1.3"}}>
              <div>{t.icon}</div>
              <div style={{marginTop:"2px"}}>{t.label}</div>
            </button>
          ))}
        </div>

        <div style={{height:"3px",background:"#e4d8c8",borderRadius:"2px",marginBottom:"20px"}}>
          <div style={{height:"100%",width:((tab/(TABS.length-1))*100)+"%",background:style?style.color:OR,borderRadius:"2px",transition:"width 0.4s ease"}}/>
        </div>

        {tab===0&&<TabBefore   style={style} onNext={()=>goTab(1)}/>}
        {tab===1&&<TabValidate onNext={()=>goTab(2)}/>}
        {tab===2&&<TabStyle    style={style} styleId={styleId} onSelect={selectStyle} onNext={()=>goTab(3)}/>}
        {tab===3&&<TabContract style={style} onNext={()=>goTab(4)}/>}
        {tab===4&&<TabExecute  style={style}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
