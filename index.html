<style>
/* demystified · Option A ("the path") tool pages: shared shell (tokens, nav, hero, footer) */
:root{--isa:#F9F6F1;--champ:#F4D7C3;--peach:#F9BC8A;--char:#3A3F4A;--ink:#2B2F38;--timb:#D6D1CB;--taupe:#88888B;--prin:#FF993F;--tang:#FF9B61;
--bull:#2F8F5B;--bull-l:#3FA36C;--bull-t:#EAF4ED;--bear:#C2543F;--bear-l:#D0604A;--bear-t:#FAECE8;--prin-t:#FFF1E4;--prin-d:#B4631C;
--disp:'Old Standard TT',Georgia,'Times New Roman',serif;--body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--isa);color:var(--char);font-family:var(--body);line-height:1.5}
a{color:inherit;text-decoration:none}
button{color:inherit;font:inherit}
svg.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
.wrap{max-width:900px;margin:0 auto;padding:0 28px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(249,246,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(58,63,74,.08)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.back{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:9px 14px 9px 10px;border-radius:999px;background:#fff;border:1px solid var(--timb)}
.back svg{transform:rotate(180deg)}
.back:hover{border-color:var(--char)}
.back:focus-visible,.brand:focus-visible{outline:2px solid var(--prin);outline-offset:2px}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:13px;width:auto}.brand b{font-family:var(--disp);font-weight:400;font-size:21px}

/* hero */
.mhero{padding:44px 0 8px}
.mhero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--taupe)}
.crumb .sw{width:12px;height:12px;border-radius:4px;background:var(--prin)}.crumb b{color:var(--char)}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(2.8rem,6.6vw,4.6rem);line-height:.96;letter-spacing:-1.5px;margin:16px 0 14px;text-wrap:balance}
.anchor{font-family:var(--disp);font-style:italic;font-size:1.3rem;color:var(--taupe);max-width:34ch}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.meta span{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--timb);padding:8px 13px;border-radius:999px}
.meta svg{color:var(--prin)}
.cover{aspect-ratio:4/3;max-width:100%;border-radius:28px;display:grid;place-items:center;padding:34px 30px 22px;position:relative;overflow:hidden}
.cover.dark{background:var(--char);color:var(--isa)}
.cover.light{background:var(--champ);color:var(--char)}
.cover::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-14%;top:-22%}
.cover.dark::before{background:var(--prin);opacity:.16}
.cover.light::before{background:var(--peach)}
.cover svg{position:relative;width:100%;height:100%}

main{padding:40px 0 0}
.stack{display:flex;flex-direction:column;gap:28px}
.klabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--taupe);margin-bottom:14px}
.klabel svg{color:var(--prin);font-size:15px}

/* footer */
footer{margin-top:80px;border-top:1px solid var(--timb)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:26px;padding-bottom:40px;font-size:13px;color:var(--taupe)}
footer .slog{font-family:var(--disp);font-style:italic;font-size:18px;color:var(--char)}
footer .fd{display:inline-flex;gap:7px;margin-right:12px;vertical-align:middle}
footer .fd i{width:7px;height:7px;border-radius:50%;background:var(--prin)}

@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .mhero .wrap{grid-template-columns:1fr}.cover{order:-1;aspect-ratio:16/9}
}
@media (max-width:640px){
  .wrap{padding:0 16px}.brand b{display:none}
  .mhero{padding-top:24px}
  .cover{border-radius:22px;padding:22px 18px 14px}
  footer{margin-top:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── tool kit: cards, fields, sliders, toggles, results (calculators, flashcards) ── */
.tcard{position:relative;background:#fff;border-radius:22px;padding:24px 26px;min-width:0}
.tcard.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:22px 0 0 22px;background:var(--acc,var(--prin))}
.tcard-h{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--char)}
.ico-t{width:36px;height:36px;border-radius:11px;background:var(--champ);color:var(--char);display:grid;place-items:center;font-size:17px;flex:none}
.tgrid{display:grid;gap:14px;min-width:0}
.tgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tgrid.form{gap:0 28px}
.tgrid.tight{gap:12px}
.field{margin-bottom:18px;min-width:0}
.field.lg{margin-bottom:22px}
.field-l{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--taupe);margin-bottom:8px}
.field-h{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:#9C9894;margin-top:2px}
.field-note{margin-top:7px;font-size:13px;font-weight:600}
.inp{display:flex;align-items:stretch;border:1px solid var(--timb);border-radius:12px;overflow:hidden;background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--prin);box-shadow:0 0 0 3px rgba(255,153,63,.22)}
.inp.on{border-color:var(--prin)}
.inp>span{display:grid;place-items:center;padding:0 12px;background:var(--isa);color:var(--taupe);font-size:13.5px;font-weight:600;border-right:1px solid var(--timb);white-space:nowrap}
.inp input{border:0;outline:0;background:transparent;padding:12px 14px;font:500 16px/1.2 var(--body);color:var(--char);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:#B9B4AE}
.inp.sm{width:140px;flex:none}.inp.sm input{padding:8px 10px;text-align:right;font-weight:600}
.seg{display:flex;gap:4px;background:#EFEAE4;border-radius:999px;padding:4px}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;border-radius:999px;padding:10px 14px;font:600 14px/1.15 var(--body);color:var(--taupe);cursor:pointer;text-align:center;transition:background .15s,color .15s}
.seg button svg{font-size:17px}
.seg button:hover{color:var(--char)}
.seg button[aria-pressed="true"]{background:var(--char);color:var(--isa)}
.seg button.on-bull[aria-pressed="true"]{background:var(--bull)}
.seg button.on-bear[aria-pressed="true"]{background:var(--bear)}
.seg button:focus-visible{outline:2px solid var(--prin);outline-offset:2px}
.seg.big button{padding:13px 16px;font-size:15px}
.seg.sm{max-width:340px}.seg.sm button{padding:8px 12px;font-size:13px}
.slider{margin-bottom:18px}
.slider-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.slider-top .field-l{margin:0}
.slider-v{font-family:var(--disp);font-size:1.3rem;line-height:1;color:var(--char);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;margin:0;background:#E6E1DA}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--thumb,var(--prin));border:3px solid #fff;box-shadow:0 1px 6px rgba(43,47,56,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--thumb,var(--prin));border:3px solid #fff;box-shadow:0 1px 6px rgba(43,47,56,.35);cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--prin);outline-offset:6px}
.kv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EFEAE4}
.kv-row:last-of-type{border-bottom:0}
.kv-k{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--taupe)}
.kv-v{font-family:var(--disp);font-size:1.2rem;line-height:1.2;color:var(--char);font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.bull{background:var(--bull);color:#fff}.chip.bear{background:var(--bear);color:#fff}.chip.mute{background:var(--taupe);color:#fff}.chip.prin{background:var(--prin);color:#fff}
.tnote{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 18px;font-size:14.5px;line-height:1.6}
.tnote>svg{font-size:19px;margin-top:2px}
.tnote p+p{margin-top:6px}
.tnote.bull{background:var(--bull-t);color:#1F5E3C}.tnote.bear{background:var(--bear-t);color:#8A3526}
.tnote.prin{background:var(--prin-t);color:#7A4312}.tnote.mute{background:#EFEAE4;color:var(--char)}
.dark-card{background:var(--char);color:var(--isa);border-radius:24px;padding:24px 28px}
.dk-l{font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--peach);margin-bottom:6px}
.dk-big{font-family:var(--disp);font-size:clamp(2rem,6vw,2.6rem);line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
.dk-mid{font-family:var(--disp);font-size:1.5rem;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.dk-sub{font-size:14px;color:var(--timb);margin-top:6px}
.dk-stats{display:flex;gap:28px;flex-wrap:wrap}
.dk-stats small{display:block;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#B9B4AE;margin-bottom:4px}
.dk-stats b{font-family:var(--disp);font-weight:400;font-size:1.2rem;color:#fff;font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--timb);border-radius:22px;padding:30px 24px;text-align:center;color:var(--taupe);font-size:15px;line-height:1.6}
.empty .ico-t{margin:0 auto 12px;width:46px;height:46px;font-size:22px}
.empty p{max-width:420px;margin:0 auto}
.fine{text-align:center;font-size:12.5px;line-height:1.6;color:#9C9894}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 14.5px/1 var(--body);padding:14px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s}
.btn.primary{background:var(--prin);color:#fff}.btn.primary:hover{background:var(--tang)}
.btn.ghost{background:#fff;border-color:var(--timb);color:var(--char)}.btn.ghost:hover{border-color:var(--char)}
.btn:focus-visible{outline:2px solid var(--prin);outline-offset:2px}
.linkback{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:600 13.5px/1 var(--body);color:var(--taupe);cursor:pointer}
.linkback svg{transform:rotate(180deg)}
.linkback:hover{color:var(--char)}
.fu{animation:fadeSlide .3s ease both}
@media (max-width:720px){
  .tgrid.c2{grid-template-columns:1fr}
  .tgrid.c2.tight{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .tcard{padding:20px 18px}
  .dark-card{padding:22px 20px}
  .dk-stats{gap:18px}
}

.dk-big .per{font-family:var(--body);font-size:15px;font-weight:500;color:var(--timb);margin-left:6px}
.dk-stats.inc{margin-top:20px;padding-top:18px;border-top:1px solid rgba(249,246,241,.1)}
.dark-card.win .dk-l{color:#86CFA3}
.prog{margin-top:20px;padding-top:6px;border-top:1px solid rgba(249,246,241,.1)}
.split{display:flex;height:8px;border-radius:8px;overflow:hidden;margin-top:14px;background:rgba(249,246,241,.14)}
.split .i{background:#86CFA3;border-radius:8px;transition:width .35s ease}
.split-l{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:12.5px;font-weight:600;color:#E6E1DA}
.prog .dk-sub{margin-top:10px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:44px minmax(0,1fr) 108px;align-items:center;gap:12px}
.bar-y{font-size:13px;font-weight:600;color:var(--taupe);font-variant-numeric:tabular-nums}
.bar-t{height:12px;border-radius:12px;background:#EFEAE4;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:12px;background:var(--timb);transition:width .3s ease}
.bar-v{font-family:var(--disp);font-size:1.05rem;color:var(--taupe);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row.on .bar-y{color:var(--char);font-weight:700}
.bar-row.on .bar-t i{background:var(--prin)}
.bar-row.on .bar-v{color:var(--prin-d);font-size:1.2rem}
.fine.l{text-align:left;margin-top:14px}
.tnote b{font-weight:700}
.next{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--timb);border-radius:18px;padding:16px 20px;font-size:14.5px;font-weight:600;color:var(--char);transition:border-color .15s}
.next:hover{border-color:var(--char)}
.next:focus-visible{outline:2px solid var(--prin);outline-offset:2px}
.next small{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--prin-d);margin-bottom:4px}
.next svg{font-size:18px;color:var(--prin);flex:none}
@media (max-width:640px){.bar-row{grid-template-columns:36px minmax(0,1fr) 92px;gap:8px}.bar-v{font-size:.98rem}.bar-row.on .bar-v{font-size:1.08rem}}

</style>
</head>

<script type="text/babel">
    const { useState } = React;
    const fmt = (v) => new Intl.NumberFormat("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0 }).format(v || 0);
    const fmt2 = (v) => new Intl.NumberFormat("en-US", { style:"currency", currency:"USD", minimumFractionDigits:2, maximumFractionDigits:2 }).format(v || 0);
    var GROWTH_URL = "https://the-hub-sable.vercel.app/tools/growth-calculator/";
    var YIELDS = [2, 3, 4, 5, 6, 8, 10];

    function Ic(props){ return <svg className="ic" aria-hidden="true"><use href={"#" + props.id}/></svg>; }

    function fieldId(label){ return "f-" + label.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

    function MoneyInput(props) {
      var label = props.label, value = props.value, onChange = props.onChange, hint = props.hint;
      var id = fieldId(label);
      return (
        <div className="field">
          <label className="field-l" htmlFor={id}>{label}{hint ? <span className="field-h">{hint}</span> : null}</label>
          <div className="inp"><span>$</span>
            <input id={id} type="text" inputMode="decimal" value={value} placeholder="0"
              onChange={function(e){ var v = e.target.value; if (v === "" || /^\d*\.?\d*$/.test(v)) onChange(v); }} />
          </div>
        </div>
      );
    }

    function SliderInput(props) {
      var label = props.label, value = props.value, onChange = props.onChange;
      var min = props.min, max = props.max, step = props.step || 1;
      var suffix = props.suffix || "", color = props.color || "#FF993F";
      var pct = Math.min(100, Math.max(0, ((value - min) / ((max - min) || 1)) * 100));
      var bg = "linear-gradient(to right," + color + " 0%," + color + " " + pct + "%,#E6E1DA " + pct + "%,#E6E1DA 100%)";
      return (
        <div className="slider">
          <div className="slider-top"><span className="field-l">{label}</span><span className="slider-v">{value.toLocaleString()}{suffix}</span></div>
          <input type="range" aria-label={label} min={min} max={max} step={step} value={value}
            onInput={function(e){ onChange(Number(e.target.value)); }}
            onChange={function(e){ onChange(Number(e.target.value)); }}
            style={{ background:bg, "--thumb":color }} />
        </div>
      );
    }

    function Segmented(props) {
      var options = props.options, value = props.value, onChange = props.onChange;
      var label = props.label, small = props.small;
      return (
        <div className={small ? "field" : "field lg"}>
          {label ? <span className="field-l">{label}</span> : null}
          <div className={"seg" + (small ? " sm" : "")} role="group" aria-label={label || "Timeline"}>
            {options.map(function(opt){
              return <button key={opt[0]} type="button" aria-pressed={value === opt[0]} onClick={function(){ onChange(opt[0]); }}>{opt[1]}</button>;
            })}
          </div>
        </div>
      );
    }

    /* Timeline: either a straight year count or two ages */
    function TimelineInput(props) {
      var mode = props.mode, setMode = props.setMode;
      var years = props.years, setYears = props.setYears;
      var curAge = props.curAge, setCurAge = props.setCurAge;
      var endAge = props.endAge, setEndAge = props.setEndAge;
      var derived = Math.max(1, endAge - curAge);

      function handleCurAge(v) {
        setCurAge(v);
        if (endAge <= v) setEndAge(Math.min(90, v + 1));
      }
      function handleEndAge(v) {
        setEndAge(Math.max(v, curAge + 1));
      }

      return (
        <div>
          <Segmented small options={[["years","years"],["ages","ages"]]} value={mode} onChange={setMode} />
          {mode === "years" ? (
            <SliderInput label="Investment Period" value={years} onChange={setYears} min={1} max={50} suffix=" yrs" color="#3A3F4A" />
          ) : (
            <div>
              <SliderInput label="Current Age" value={curAge} onChange={handleCurAge} min={18} max={80} suffix=" yrs" color="#3A3F4A" />
              <SliderInput label="Target Age" value={endAge} onChange={handleEndAge} min={19} max={90} suffix=" yrs" color="#3A3F4A" />
              <div className="derived"><span className="kv-k">Investment Period</span><span className="slider-v">{derived} yrs</span></div>
            </div>
          )}
        </div>
      );
    }

    function EmptyState(props) {
      return <div className="empty"><span className="ico-t"><Ic id={props.icon} /></span><p>{props.text}</p></div>;
    }

    function yieldRows(current) {
      var ys = YIELDS.slice();
      if (ys.indexOf(current) === -1) ys.push(current);
      return ys.sort(function(a, b){ return a - b; });
    }

    /* one row per yield, the member's own yield highlighted */
    function Bars(props) {
      var rows = props.rows, max = Math.max.apply(null, rows.map(function(r){ return r.n; }).concat([1]));
      return (
        <div className="bars">
          {rows.map(function(r){ return (
            <div key={r.y} className={"bar-row" + (r.on ? " on" : "")}>
              <span className="bar-y">{r.y + "%"}</span>
              <div className="bar-t"><i style={{ width: Math.max(1.5, r.n / max * 100) + "%" }} /></div>
              <span className="bar-v">{r.text}</span>
            </div>
          ); })}
        </div>
      );
    }

    function YieldNote() {
      return (
        <div className="tnote prin"><Ic id="i-coins" /><div>
          <p><b>income yield</b> is the cash your investments pay you in a year (like dividends, interest or rent), as a percent of what you have invested.</p>
          <p>it is not your total return. whether the investments themselves go up or down in value is separate, and isn’t part of this calculator.</p>
        </div></div>
      );
    }

    function NextLink(props) {
      return <a className="next" href={GROWTH_URL}><span><small>{props.kicker}</small>{props.text}</span><Ic id="i-arrow" /></a>;
    }

    function IncomeTab(props) {
      var n = parseFloat(props.invested) || 0, y = props.rate;
      var annual = n * y / 100, monthly = annual / 12;
      return (
        <div className="stack">
          <div className="tcard">
            <div className="tcard-h"><span className="ico-t"><Ic id="i-briefcase" /></span>your investments</div>
            <div className="tgrid c2 form">
              <MoneyInput label="Amount Invested" value={props.invested} onChange={props.setInvested} hint="What you have invested" />
              <SliderInput label="Annual Income Yield" value={y} onChange={props.setRate} min={0.5} max={15} step={0.25} suffix="%" color="#FF993F" />
            </div>
          </div>

          {n <= 0 ? (
            <EmptyState icon="i-coins" text="Enter an amount invested to see the income it could pay you." />
          ) : (
            <div className="stack">
              <div className="dark-card">
                <div className="dk-l">passive income</div>
                <div className="dk-big">{fmt(monthly)}<span className="per"> a month</span></div>
                <div className="dk-sub">{"from " + fmt(n) + " invested at a " + y + "% income yield"}</div>
                <div className="dk-stats inc">
                  <div><small>Per Year</small><b>{fmt(annual)}</b></div>
                  <div><small>Per Week</small><b>{fmt(annual / 52)}</b></div>
                  <div><small>Per Day</small><b>{fmt2(annual / 365)}</b></div>
                </div>
              </div>

              <div className="tcard">
                <div className="tcard-h"><span className="ico-t"><Ic id="i-bars" /></span>the same money at other yields</div>
                <Bars rows={yieldRows(y).map(function(r){ var m = n * r / 100 / 12; return { y:r, n:m, text:fmt(m) + "/mo", on:r === y }; })} />
              </div>
            </div>
          )}

          <YieldNote />
          <NextLink kicker="want this number bigger?" text="see how the amount invested can grow · long-term growth calculator" />
          <p className="fine">Income is shown before taxes and fees and assumes the yield stays the same. Yields change over time.</p>
        </div>
      );
    }

    function GoalTab(props) {
      var _g = useState("5000"), goal = _g[0], setGoal = _g[1];
      var _p = useState("month"), per = _p[0], setPer = _p[1];
      var g = parseFloat(goal) || 0, y = props.rate, have = parseFloat(props.invested) || 0;
      var annualGoal = per === "month" ? g * 12 : g, monthlyGoal = annualGoal / 12;
      var capital = annualGoal / (y / 100);
      var pct = capital > 0 ? Math.min(100, have / capital * 100) : 0;
      var haveMonthly = have * y / 100 / 12;
      return (
        <div className="stack">
          <div className="tcard">
            <div className="tcard-h"><span className="ico-t"><Ic id="i-target" /></span>your income goal</div>
            <Segmented small label="Income goal" value={per} onChange={setPer} options={[["month","per month"],["year","per year"]]} />
            <div className="tgrid c2 form">
              <MoneyInput label={per === "month" ? "Monthly Income Goal" : "Yearly Income Goal"} value={goal} onChange={setGoal} hint="The income you want your money to pay" />
              <SliderInput label="Annual Income Yield" value={y} onChange={props.setRate} min={0.5} max={15} step={0.25} suffix="%" color="#FF993F" />
              <MoneyInput label="Already Invested" value={props.invested} onChange={props.setInvested} hint="Optional · shows how far along you are" />
            </div>
          </div>

          {g <= 0 ? (
            <EmptyState icon="i-target" text="Enter the income you want to see how much you’d need invested." />
          ) : (
            <div className="stack">
              <div className={"dark-card" + (have >= capital ? " win" : "")}>
                <div className="dk-l">invested capital needed</div>
                <div className="dk-big">{fmt(capital)}</div>
                <div className="dk-sub">{"to pay " + fmt(monthlyGoal) + " a month (" + fmt(annualGoal) + " a year) at a " + y + "% income yield"}</div>
                {have > 0 ? (
                  <div className="prog">
                    <div className="split"><div className="i" style={{ width: pct + "%" }} /></div>
                    <div className="split-l">
                      <span>{have >= capital ? "you’re there" : "you have " + (pct < 1 ? "under 1" : Math.floor(pct)) + "% of it"}</span>
                      <span>{have >= capital ? fmt(have - capital) + " above the goal" : fmt(capital - have) + " to go"}</span>
                    </div>
                    <div className="dk-sub">{"today, " + fmt(have) + " would pay about " + fmt(haveMonthly) + " a month at this yield."}</div>
                  </div>
                ) : null}
              </div>

              <div className="tcard">
                <div className="tcard-h"><span className="ico-t"><Ic id="i-bars" /></span>the same goal at other yields</div>
                <Bars rows={yieldRows(y).map(function(r){ var c = annualGoal / (r / 100); return { y:r, n:c, text:fmt(c), on:r === y }; })} />
                <p className="fine l">A higher yield needs less money invested, but a higher yield usually comes with more risk.</p>
              </div>
            </div>
          )}

          <YieldNote />
          <NextLink kicker={g > 0 ? "how do i get to " + fmt(capital) + "?" : "how do i get there?"} text="plan the path · goal planner in the long-term growth calculator" />
          <p className="fine">Income is shown before taxes and fees and assumes the yield stays the same. Yields change over time.</p>
        </div>
      );
    }

    function App() {
      var _t = useState("income"), tab = _t[0], setTab = _t[1];
      var _i = useState("100000"), invested = _i[0], setInvested = _i[1];
      var _r = useState(5), rate = _r[0], setRate = _r[1];
      var TABS = [["income","income","i-coins"],["goal","income goal","i-target"]];
      return (
        <div className="stack">
          <div className="seg big" role="group" aria-label="Calculator">
            {TABS.map(function(x){ return (
              <button key={x[0]} type="button" aria-pressed={tab === x[0]} onClick={function(){ setTab(x[0]); }}><Ic id={x[2]} />{x[1]}</button>
            ); })}
          </div>
          {tab === "income" ? <IncomeTab invested={invested} setInvested={setInvested} rate={rate} setRate={setRate} /> : null}
          {tab === "goal" ? <GoalTab invested={invested} setInvested={setInvested} rate={rate} setRate={setRate} /> : null}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
